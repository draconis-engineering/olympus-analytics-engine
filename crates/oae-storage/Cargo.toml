[package]
name = "oae-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
oae-core = { path = "../oae-core" }
oae-data = { path = "../oae-data" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27"
