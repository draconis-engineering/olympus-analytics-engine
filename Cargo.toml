[package]
name = "olympus-analytics-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
oae-core = { path = "crates/oae-core" }
oae-storage = { path = "crates/oae-storage" }

[workspace]
members = [
    "crates/oae-core",
    "crates/oae-analytics",
    "crates/oae-api",
    "crates/oae-storage", "crates/oae-data",
]

resolver = "3"
